<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#efede6">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d0c">
    <meta name="description" content="A C. elegans worm driven entirely by a simulation of its connectome, running in your browser.">
    <title>C. elegans Sim</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M5 19c3.5-7 7-7 11 0s7.5 7 11 0' fill='none' stroke='%2315876a' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap">
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>
    <canvas id="canvas" aria-label="Worm simulation. Click or tap to drop food."></canvas>

    <header class="masthead">
        <h1>C. elegans</h1>
        <p class="tagline">A nematode driven by its own connectome</p>
        <div class="status" id="status" data-state="forage" aria-live="polite">
            <span class="status-dot"></span>
            <span id="statusText">Foraging</span>
            <span id="eatenText" class="eaten"></span>
        </div>
    </header>

    <aside id="brainPanel" class="panel brain" aria-label="Connectome activity">
        <canvas id="brainCanvas"></canvas>
        <div class="caption">
            <span id="brainLabel">Connectome</span>
            <span id="brainMeta"></span>
        </div>
    </aside>

    <p id="hint" class="hint"><span class="on-pointer">Click</span><span class="on-touch">Tap</span> anywhere to drop food</p>

    <nav class="panel toolbar" aria-label="Simulation controls">
        <button id="centerButton" class="tool" type="button" title="Recenter worm" aria-label="Recenter worm">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="6.5" />
                <circle cx="12" cy="12" r="1.6" class="fill" />
                <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3" />
            </svg>
        </button>
        <button id="clearButton" class="tool" type="button" title="Clear food" aria-label="Clear food" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4.5 7h15M9.5 7V4.8h5V7M6.5 7l.9 12.2h9.2l.9-12.2M10.2 10.5v5.5M13.8 10.5v5.5" />
            </svg>
        </button>
        <button id="brainButton" class="tool" type="button" title="Show connectome" aria-label="Show connectome" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 7.5l5 4.5M17 7.5l-5 4.5M12 12v5.5M7 7.5L17 7.5" />
                <circle cx="6" cy="6.5" r="2.2" class="fill" />
                <circle cx="18" cy="6.5" r="2.2" class="fill" />
                <circle cx="12" cy="12" r="2.2" class="fill" />
                <circle cx="12" cy="18.5" r="2.2" class="fill" />
            </svg>
        </button>
        <span class="divider" aria-hidden="true"></span>
        <a class="tool" href="https://github.com/heyseth/worm-sim" title="View source on GitHub" aria-label="View source on GitHub" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path class="fill" stroke="none" d="M12 2.2a9.8 9.8 0 0 0-3.1 19.1c.5.1.7-.2.7-.5v-1.7c-2.7.6-3.3-1.3-3.3-1.3-.4-1.1-1.1-1.4-1.1-1.4-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.6.3-1.1.6-1.3-2.2-.3-4.5-1.1-4.5-4.9 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.6 0 0 .8-.3 2.7 1a9.3 9.3 0 0 1 4.9 0c1.9-1.3 2.7-1 2.7-1 .5 1.3.2 2.3.1 2.6.6.7 1 1.6 1 2.7 0 3.8-2.3 4.6-4.5 4.9.4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A9.8 9.8 0 0 0 12 2.2z" />
            </svg>
        </a>
    </nav>

    <script src="./js/constants.js"></script>
    <script src="./js/connectome.js"></script>
    <script src="./js/main.js"></script>
</body>

</html>
